<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#F7F8FA">
<title>奕识 · 现场取证</title>
<style>
:root{
  --bg:#F7F8FA; --surface:#FFFFFF; --surface2:#F1F3F7; --line:#E3E6ED;
  --ink:#1E2430; --ink2:#59627A; --ink3:#8B93A7;
  --blue:#2E6FD6; --blue-bg:#EAF1FC;
  --teal:#0F8A72; --teal-bg:#E4F5F0;
  --amber:#B87B15; --amber-bg:#FCF3E2;
  --red:#C0392B; --red-bg:#FCEAE7;
  --purple:#6B4FC4; --purple-bg:#F0ECFB;
  --r:12px; --font:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.65;-webkit-font-smoothing:antialiased}
.wrap{max-width:640px;margin:0 auto;padding:20px 18px 90px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;margin-bottom:14px}
h1{font-size:21px;font-weight:650;letter-spacing:.3px;margin-bottom:6px}
h2{font-size:16.5px;font-weight:650;margin-bottom:4px}
h3{font-size:14px;font-weight:650;margin-bottom:8px}
p{font-size:14px;color:var(--ink2)}
.small{font-size:12.5px;color:var(--ink3);line-height:1.6}
.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:12px}
.note{background:var(--blue-bg);border-left:3px solid var(--blue);padding:11px 13px;border-radius:0 8px 8px 0;font-size:13px;color:var(--ink2);margin:12px 0}
.note.warn{background:var(--amber-bg);border-left-color:var(--amber)}
.note.bad{background:var(--red-bg);border-left-color:var(--red)}
.note.good{background:var(--teal-bg);border-left-color:var(--teal)}
.note b{color:var(--ink)}
.tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:5px;background:var(--surface2);color:var(--ink2);margin-right:5px}
.tag.b{color:var(--blue);background:var(--blue-bg)}
.tag.t{color:var(--teal);background:var(--teal-bg)}
.tag.a{color:var(--amber);background:var(--amber-bg)}
.tag.r{color:var(--red);background:var(--red-bg)}
.tag.p{color:var(--purple);background:var(--purple-bg)}
button{font-family:var(--font);font-size:15px;font-weight:500;padding:13px 20px;border:1px solid var(--line);
  background:var(--surface);color:var(--ink);border-radius:10px;cursor:pointer;transition:.15s;width:100%;text-align:left}
button:active{transform:scale(.985)}
button.primary{background:var(--blue);border-color:var(--blue);color:#fff;text-align:center;font-weight:600}
button:disabled{opacity:.4}
.opt{display:block;margin-bottom:10px;padding:15px 16px;line-height:1.6}
.opt:hover{border-color:var(--blue)}
.opt .l{font-size:15px;font-weight:600;color:var(--ink)}
.opt .d{font-size:13px;color:var(--ink2);margin-top:4px}
.opt .c{font-size:12px;color:var(--amber);margin-top:6px}
.qctx{font-size:14.5px;color:var(--ink);line-height:1.75;margin-bottom:6px}
.progress{height:3px;background:var(--surface2);border-radius:2px;overflow:hidden;margin-bottom:16px}
.progress i{display:block;height:100%;background:var(--blue);transition:width .25s}
.qmeta{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;font-size:12px;color:var(--ink3)}
.timer{font-variant-numeric:tabular-nums;font-weight:600}
.bar{height:7px;border-radius:4px;background:var(--surface2);overflow:hidden;margin-top:5px}
.bar i{display:block;height:100%;border-radius:4px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:9px 6px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:11.5px;color:var(--ink3);font-weight:600}
tr:last-child td{border-bottom:none}
.evi{padding:12px 0;border-bottom:1px solid var(--line)}
.evi:last-child{border-bottom:none}
.evi .t{font-size:14px;font-weight:600;margin-bottom:3px}
.evi .d{font-size:12.5px;color:var(--ink2)}
.seg{display:flex;gap:6px;margin:8px 0}
.seg button{flex:1;text-align:center;padding:10px 6px;font-size:13px;font-weight:600}
.seg button.on{background:var(--blue);border-color:var(--blue);color:#fff}
.fig{border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:10px}
.node{border-left:2px solid var(--line);padding:2px 0 2px 10px;margin:8px 0;font-size:12.5px;color:var(--ink2)}
.node b{color:var(--ink)}
.book{display:flex;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
.book:last-child{border-bottom:none}
.book .idx{flex:0 0 24px;height:24px;border-radius:6px;background:var(--teal-bg);color:var(--teal);font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center}
.book.skip .idx{background:var(--surface2);color:var(--ink3)}
.radar-wrap{text-align:center}
.sec-h{display:flex;align-items:center;gap:9px;margin-bottom:3px}
.sec-n{flex:0 0 24px;height:24px;border-radius:7px;background:var(--blue-bg);color:var(--blue);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center}
.sec-sub{font-size:12.5px;color:var(--ink3);margin:0 0 14px 33px}
footer{text-align:center;font-size:12px;color:var(--ink3);padding:20px 0 0}
.fixedbar{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:10px 18px calc(10px + env(safe-area-inset-bottom))}
.fixedbar .in{max-width:640px;margin:0 auto;display:flex;gap:10px}
.fixedbar button{flex:1}
</style>
</head>

<div class="wrap" id="app"></div>

<script>
/* ==================================================================
   奕识 · 现场取证
   不读任何历史数据：18 个限时两难情境，用选择与答题时长产生行为证据。
   全部在浏览器内计算，无网络请求，关页即失（可手动导出 JSON）。
   ================================================================== */

/* ---------- 题库：18 题，每题两个选项都有代价 ---------- */

  b:{l:'动手把小项目做出来',d:'哪怕粗糙，先有个能跑的东西',c:'认知没想透，可能白做',dims:{build:2,decide:1,explore:-1}}},

function pick(k){

/* ---------- 计分 ---------- */
function scoreProfile(){
  const sum = {}, cap = {};
  DIMS.forEach(d=>{ sum[d]=0; cap[d]=0; });
  QS.forEach((q,i)=>{
    const a = S.ans[i];
    // 该题对每个维度的最大可能偏离幅度（用于归一化，避免"没出过这题"被算成 0 分）
    DIMS.forEach(d=>{
      const va = (q.a.dims[d]||0), vb = (q.b.dims[d]||0);
      const mx = Math.max(Math.abs(va), Math.abs(vb));
      if (mx > 0) cap[d] += mx;
    });
    if (!a) return;
    DIMS.forEach(d=>{ sum[d] += (a.dims[d]||0); });
  });
  const dims = {};
  DIMS.forEach(d=>{
    const c = cap[d] || 1;
    const ratio = Math.max(-1, Math.min(1, sum[d]/c));
    dims[d] = Math.round(Math.max(5, Math.min(95, 50 + 45*ratio)) * 10)/10;
  });
  return dims;
}

/* ---------- 适配分（与 score.py 同源） ---------- */
function fitScore(dims, demand){
  let num=0, den=0; const detail=[]; const wasted=[];
  Object.keys(demand).forEach(d=>{
    const need = demand[d], u = dims[d]||0, dw = DIM_W[d]||1;
    let match, status;
    if (u < need) { match = 100-(need-u); status='不足'; }
    else { match = 100-(u-need)*0.55; status='充足'; }
    if (need <= 55 && u >= 75) wasted.push(d);
    const w = need*dw;
    num += w*match; den += w;
    detail.push({d, u, need, match:Math.round(match*10)/10, status});
  });
  let raw = den ? num/den : 0;
  raw -= wasted.length*2.5;
  const score = 60 + (raw-60)*1.0;   // 现场取证：全部维度都有证据，coverage=1
  return {fit: Math.round(Math.max(0,Math.min(100,score))*10)/10, detail, wasted};
}

function quadOf(fit, social, mid){
  const hi = fit >= mid, near = social >= 60;
  if (hi && near) return {k:'best', label:'最优路线', adv:'做起来顺手，还有路可走，试错成本最低。优先在这里找具体机会。'};
  if (hi && !near) return {k:'hard', label:'高潜力高难度', adv:'很适合你，但孤军奋战。先解决"谁带你进门"，而不是先证明能力。'};
  if (!hi && near) return {k:'drain', label:'容易上手但内耗', adv:'路好走，但长期消耗底色。可做跳板，但要设明确的退出时间点。'};
  return {k:'avoid', label:'双重劣势', adv:'既不合手也够不着。除非有非常具体的理由，不要当主选项。'};
}

/* ---------- 图表 ---------- */
function radar(dims){
  const keys = DIMS, cx=150, cy=148, R=100, n=keys.length;
  const pt=(i,r)=>{const a=-Math.PI/2+i*2*Math.PI/n;return [cx+Math.cos(a)*r, cy+Math.sin(a)*r];};
  let rings='';
  [0.25,0.5,0.75,1].forEach(k=>{
    rings += `<polygon points="${keys.map((_,i)=>pt(i,R*k).map(v=>v.toFixed(1)).join(',')).join(' ')}" fill="none" stroke="#E3E6ED"/>`;
  });
  let axes='', ticks='';
  keys.forEach((k,i)=>{
    const [x,y]=pt(i,R);
    axes += `<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="#E3E6ED"/>`;
    const [lx,ly]=pt(i,R+20);
    ticks += `<text x="${lx.toFixed(1)}" y="${ly.toFixed(1)}" font-size="10" fill="#59627A" text-anchor="middle" dominant-baseline="middle">${DL[k]}</text>`;
  });
  const poly = keys.map((k,i)=>pt(i,R*Math.max(.03,(dims[k]||0)/100)).map(v=>v.toFixed(1)).join(',')).join(' ');
  return `<svg viewBox="0 0 300 300" width="290" height="290" role="img" aria-label="底色雷达图">
    ${rings}${axes}
    <polygon points="${poly}" fill="rgba(46,111,214,.16)" stroke="#2E6FD6" stroke-width="1.8"/>
    ${ticks}</svg>`;
}

function scatter(roles, mid){
  const W=560,H=340,pad=46;
  const x0=pad,x1=W-pad,y0=pad,y1=H-pad;
  const sx=v=>x0+(v/100)*(x1-x0), sy=v=>y1-(v/100)*(y1-y0);
  const mx=sx(60), my=sy(mid);
  const col={best:'#0F8A72',hard:'#2E6FD6',drain:'#B87B15',avoid:'#C0392B'};
  let s=`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="四象限">`;
  s+=`<rect x="${x0}" y="${y0}" width="${mx-x0}" height="${my-y0}" fill="#2E6FD6" opacity=".05"/>`;
  s+=`<rect x="${mx}" y="${y0}" width="${x1-mx}" height="${my-y0}" fill="#0F8A72" opacity=".05"/>`;
  s+=`<rect x="${x0}" y="${my}" width="${mx-x0}" height="${y1-my}" fill="#C0392B" opacity=".05"/>`;
  s+=`<rect x="${mx}" y="${my}" width="${x1-mx}" height="${y1-my}" fill="#B87B15" opacity=".05"/>`;
  s+=`<line x1="${mx}" y1="${y0}" x2="${mx}" y2="${y1}" stroke="#D8DCE6" stroke-dasharray="4 4"/>`;
  s+=`<line x1="${x0}" y1="${my}" x2="${x1}" y2="${my}" stroke="#D8DCE6" stroke-dasharray="4 4"/>`;
  [[x0+8,y0+16,'适配高·距离远','#2E6FD6','start'],[x1-8,y0+16,'适配高·距离近','#0F8A72','end'],
   [x0+8,y1-8,'适配低·距离远','#C0392B','start'],[x1-8,y1-8,'适配低·距离近','#B87B15','end']]
   .forEach(([x,y,t,c,a])=>{ s+=`<text x="${x}" y="${y}" font-size="10" fill="${c}" text-anchor="${a}">${t}</text>`; });
  roles.forEach(r=>{
    const x=sx(r.social), y=sy(r.fit), c=col[r.quad.k];
    s+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="6" fill="${c}" opacity=".88"/>`;
    s+=`<text x="${x.toFixed(1)}" y="${(y-11).toFixed(1)}" font-size="10" font-weight="600" fill="#1E2430" text-anchor="middle">${r.name.split(' ')[0]}</text>`;
    s+=`<text x="${x.toFixed(1)}" y="${(y+18).toFixed(1)}" font-size="9.5" fill="#8B93A7" text-anchor="middle">${r.total}</text>`;
  });
  s+=`</svg>`;
  return s;
}

        </div>
        <div class="small" style="margin-top:4px">${esc(r.work)}</div>
        <div class="small" style="margin-top:4px;color:var(--ink3)">适配 ${r.fit}　社会 ${r.social}　综合 <b style="color:${c};font-size:15px">${r.total}</b></div>
        <div class="bar"><i style="width:${r.total}%;background:${c}"></i></div>
        <div style="margin-top:8px">${reasons}</div>
        ${r.wasted.length ? `<div class="note warn" style="margin:8px 0 0;font-size:12px">你的「${r.wasted.map(d=>DL[d]).join('、')}」在这条路上用不上——内耗感的来源，不是能力问题。</div>` : ''}
        <div class="small" style="margin-top:6px">代价：${esc(r.cost)}</div>
      </div>`;
    }).join('')}
  </div>

  <div class="card">
    <div class="sec-h"><div class="sec-n">④</div><h2>四象限</h2></div>
    <div class="sec-sub">纵轴合不合手，横轴够不够得着。适配以中位数 ${mid} 为界。</div>
    ${scatter(roles, mid)}
    <div class="note"><b>先看哪个象限人最多。</b>如果一个都没有，说明你还没进入任何一条路的有效射程——此时的任务是补入口，不是挑方向。</div>
  </div>

  <div class="card">
    <div class="sec-h"><div class="sec-n">⑤</div><h2>历史人物</h2></div>
    <div class="sec-sub">比的是决策结构，不是性格。每条都附"不能类比之处"。</div>
    ${figs.map(f=>`<div class="fig">
      <div style="display:flex;justify-content:space-between;align-items:baseline">
        <b style="font-size:15px">${f.name}<span class="small" style="margin-left:6px">${f.era}</span></b>
        <span class="mono small">契合 ${f.score}</span>
      </div>
      <div class="small" style="margin:4px 0 8px">${esc(f.line)}</div>
      ${f.nodes.map(n=>`<div class="node">约束：<b>${esc(n.c)}</b><br>守住：${esc(n.k)}<br>代价：${esc(n.p)}</div>`).join('')}
      <div class="note good" style="margin:8px 0 6px;font-size:12px"><b>对你适用：</b>${esc(f.fit)}</div>
      <div class="note bad" style="margin:0;font-size:12px"><b>不能类比：</b>${esc(f.not)}</div>
    </div>`).join('')}
  </div>

  <div class="card">
    <div class="sec-h"><div class="sec-n">⑥</div><h2>书籍匹配</h2></div>
    <div class="sec-sub">按你当前最高的维度选，不按评分。</div>
    <h3 style="color:var(--teal);margin-top:6px">现在读</h3>
    ${nowBooks.map((b,i)=>`<div class="book"><div class="idx">${i+1}</div><div>
      <div style="font-weight:600;font-size:13.5px">${esc(b.t)}<span class="small" style="margin-left:6px">${esc(b.a)}</span></div>
      <div class="small" style="margin-top:2px">解答：${esc(b.q)}</div></div></div>`).join('')}
    <h3 style="color:var(--ink3);margin-top:16px">现在不必读</h3>
    ${skipBooks.map((b,i)=>`<div class="book skip"><div class="idx">${i+1}</div><div>
      <div style="font-weight:600;font-size:13.5px">${esc(b.t)}</div>
      <div class="small" style="margin-top:2px;color:var(--amber)">${esc(b.skip)}</div></div></div>`).join('')}
  </div>

  <div class="card">
    <div class="sec-h"><div class="sec-n">⑦</div><h2>扰动校准</h2></div>
    <div class="sec-sub">这一节只做一件事：告诉你现在的状态会不会让上面的结论变形。</div>
    <div class="note ${avg < 4000 ? 'warn' : 'good'}"><b>答题速度：</b>平均每题 ${(avg/1000).toFixed(1)} 秒。
      ${avg < 4000 ? '整体偏快，可能是凭直觉答的——结论反映的是本能，不是深思后的取舍。' :
        (avg > 15000 ? '整体偏慢，你可能在每题上都在权衡"哪个更正确"，而不是"哪个更像你"。' :
        '节奏正常，直觉和权衡混合，这类结论通常最稳。')}</div>
    <div class="note"><b>焦虑未测：</b>本版本没有你的历史语料，无法计算焦虑与滤镜。如果你正在急着要一个答案，任何排序都会被"尽快确定"的心态放大——隔两周再答一次，看结论是否稳定，比一次作答可靠得多。</div>
    <div class="note bad"><b>社会距离是短板：</b>这里用的是岗位客观开放度，不知道你实际认识谁。完整版会用你语料里的"岗位词 × 人脉词"共现来校准——这也是两条路差距最大的地方。</div>
  </div>

  <div class="card">
    <div class="sec-h"><div class="sec-n" style="background:var(--surface2);color:var(--ink3)">附</div><h2>这份报告不能回答什么</h2></div>
    <div class="sec-sub">比前面任何一节都重要。</div>
    <div class="note bad"><b>它只测了 18 次取舍。</b>不是半年行为轨迹。18 题能看出倾向，看不出一致性——同一个人隔一周答，可能有 2-3 个维度变化。</div>
    <div class="note bad"><b>它读的是"你在假设情境里怎么选"。</b>真实工作里有资源、老板、deadline 的约束，假设情境里没有。所以它回答"你的倾向"，不回答"你会怎么做"。</div>
    <div class="note bad"><b>它不知道你的能力。</b>拆解倾向强不代表能做投研——后者还需要财务基础、承压能力、市场判断。倾向 ≠ 胜任力。</div>
    <div class="note bad" style="margin-bottom:0"><b>它不替你做决定。</b>只回答"合不合手、够不够得着"，不回答"你该选哪个"。</div>
  </div>

  <div class="fixedbar"><div class="in">
    <button onclick="exportJSON()">导出数据</button>
    <button class="primary" onclick="reset()">重新作答</button>
  </div></div>`;

  window.scrollTo(0,0);
}

/* ---------- 导出 ---------- */
function exportJSON(){
  const dims = scoreProfile();
  const payload = {
    meta: {source:'quiz', generated_at:new Date().toISOString(), note:'现场取证版：18 题限时取舍，无历史语料'},
    profile: {dims, known:Object.fromEntries(DIMS.map(d=>[d,true]))},
    answers: S.ans.map((a,i)=>({idx:i+1, ctx:QS[i].ctx, chose:a.label, ms:a.ms, dims:a.dims}))
  };
  const blob = new Blob([JSON.stringify(payload,null,2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'yishi-quiz-'+new Date().toISOString().slice(0,10)+'.json';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 3000);
}

/* ---------- 工具 ---------- */
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function median(a){ const b=[...a].sort((x,y)=>x-y); const m=Math.floor(b.length/2); return b.length%2?b[m]:Math.round((b[m-1]+b[m])/2*10)/10; }

/* ---------- 启动 ---------- */
load();
renderHome();
</script>
</body>
</html>
